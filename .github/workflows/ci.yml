name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit traceability
        run: ./scripts/audit-history.sh
      - name: Verify backend
        run: ./mvnw -B verify
      - name: Verify frontend
        run: npm --prefix frontend ci && npm --prefix frontend audit --audit-level=moderate && npm --prefix frontend run test:ci && npm --prefix frontend run build
      - name: Validate Compose
        run: docker compose config --quiet
