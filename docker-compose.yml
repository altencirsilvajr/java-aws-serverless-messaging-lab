services:
  localstack:
    image: localstack/localstack:4.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 2s
      retries: 30

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT: http://localstack:4566
      COMMAND_QUEUE_URL: http://localstack:4566/000000000000/processing-commands
      COMMAND_DLQ_URL: http://localstack:4566/000000000000/processing-commands-dlq
      PROCESSING_TABLE: processing-state
      CORS_ORIGINS: http://localhost:4200,http://localhost:8088
    depends_on:
      localstack:
        condition: service_healthy
